version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: pragati_timescaledb
    restart: always
    environment:
      POSTGRES_DB: pragati_db
      POSTGRES_USER: pragati_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-PragatiProdSecure2026!}
    ports:
      - "5432:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pragati_admin -d pragati_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pragati_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pragati_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://pragati_admin:PragatiProdSecure2026!@timescaledb:5432/pragati_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  tsdata:
